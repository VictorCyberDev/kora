name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kora
          POSTGRES_PASSWORD: kora
          POSTGRES_DB: kora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kora -d kora_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kora:kora@localhost:5432/kora_test
      NODE_ENV: test
      MONITOR_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Verify package runtime exports
        run: |
          test -f packages/event-schema/dist/src/index.js
          test -f services/incident-engine/dist/src/index.js
          test -f packages/topology/dist/index.js
          test -f packages/site-schema/dist/src/index.js
          test -f packages/site-serving/dist/src/index.js
          test -f packages/growth/dist/src/index.js
          test -f apps/api/dist/db/migrations/013_presence.sql
          test -f apps/api/dist/db/migrations/015_customers.sql
          test -f apps/api/dist/db/migrations/016_studio.sql
          test -f apps/api/dist/db/migrations/017_calendar_publishing.sql
          test -f apps/api/dist/db/migrations/018_marketing.sql
          test -f apps/api/dist/db/migrations/020_intelligence.sql
          test -f apps/api/dist/db/migrations/021_usage_dimensions.sql
          test -f packages/site-fonts/dist/index.js
          test -f packages/site-media/dist/index.js
          test -f packages/site-media/files/restaurant-timber-ceiling.webp
          test -f packages/site-fonts/files/inter-latin-400-normal.woff2
          test -f apps/site-host/dist/server.js
          test -f apps/api/dist/db/migrations/012_tenant_integrity_site_host.sql
          test -f apps/web/dist/index.html
          test -f apps/api/dist/db/migrations/011_site_faults.sql
          pnpm --filter @kora/api exec node -e "Promise.all([import('@kora/event-schema'), import('@kora/incident-engine'), import('@kora/site-schema'), import('@kora/growth'), import('@kora/reasoner'), import('@kora/policy-engine'), import('@kora/action-executor')])"
      - name: Secret scan (high-signal patterns, tracked files only)
        run: |
          if git grep -nEI '(sk_(live|test)_[A-Za-z0-9]{16,}|rmp_[A-Za-z0-9]{16,}|ghp_[A-Za-z0-9]{30,}|-----BEGIN (RSA |EC )?PRIVATE KEY-----)' -- . ':!apps/api/test-fixtures' ':!*.test.ts' ':!*/test/*'; then
            echo "possible committed secret"; exit 1
          fi
      - run: pnpm db:migrate
      - name: Migrations are re-runnable (upgrade path)
        run: pnpm db:migrate
      - run: pnpm -r test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kora
          POSTGRES_PASSWORD: kora
          POSTGRES_DB: kora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kora -d kora_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kora:kora@localhost:5432/kora_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  docker-image:
    name: docker image (build, no push)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kora
          POSTGRES_PASSWORD: kora
          POSTGRES_DB: kora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kora -d kora_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the root Dockerfile and check the containers
        run: .github/scripts/image-check.sh
