name: Temporary PR40 formatting gate
on:
  push:
    branches: [feature/kora-creative-intelligence-m1-m2]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact PR40 files
        run: |
          pnpm exec prettier --write .github/workflows/ci.yml apps/api/src/platform/author.ts apps/api/src/platform/routes.ts apps/web/package.json apps/web/src/App.tsx apps/web/src/pages/build.tsx apps/web/src/pages/media-library.tsx apps/web/src/pages/website-studio.tsx docs/design-intelligence/SOURCES.md e2e/visual-observe.ts e2e/website-studio-benchmark.spec.ts e2e/website-studio-flow.spec.ts packages/creative/src/design-rules.ts packages/creative/src/directions.ts packages/creative/src/index.ts packages/creative/test/design-rules.test.ts packages/site-schema/src/v3/index.ts packages/site-schema/src/v3/page-edit.ts packages/site-schema/src/v3/plan.ts packages/site-schema/src/v3/render.ts packages/site-schema/src/v3/spec.ts packages/site-schema/src/v3/visual-qa.ts packages/site-schema/test/page-edit.test.ts packages/site-schema/test/visual-qa.test.ts pnpm-lock.yaml third_party/LICENSES.md third_party/manifest.json
      - name: Preserve repaired formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml apps/api/src/platform/author.ts apps/api/src/platform/routes.ts apps/web/package.json apps/web/src/App.tsx apps/web/src/pages/build.tsx apps/web/src/pages/media-library.tsx apps/web/src/pages/website-studio.tsx docs/design-intelligence/SOURCES.md e2e/visual-observe.ts e2e/website-studio-benchmark.spec.ts e2e/website-studio-flow.spec.ts packages/creative/src/design-rules.ts packages/creative/src/directions.ts packages/creative/src/index.ts packages/creative/test/design-rules.test.ts packages/site-schema/src/v3/index.ts packages/site-schema/src/v3/page-edit.ts packages/site-schema/src/v3/plan.ts packages/site-schema/src/v3/render.ts packages/site-schema/src/v3/spec.ts packages/site-schema/src/v3/visual-qa.ts packages/site-schema/test/page-edit.test.ts packages/site-schema/test/visual-qa.test.ts pnpm-lock.yaml third_party/LICENSES.md third_party/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "style(pr40): format only M1/M2 implementation files"
            git push origin HEAD:feature/kora-creative-intelligence-m1-m2
          fi
