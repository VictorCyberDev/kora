name: Temporary Krevstudio source formatting
on:
  push:
    branches:
      - feature/krevstudio-creative-m5-motion-editor
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/src/growth/creative.integration.test.ts apps/api/src/growth/creative-routes.ts apps/api/src/platform/creative-documents.ts apps/api/src/platform/creative-documents.test.ts apps/api/src/platform/creative-evaluation.ts apps/api/src/platform/creative-evaluation.test.ts apps/web/src/pages/audit.tsx apps/web/src/pages/public.tsx apps/web/src/pages/today.tsx apps/web/src/today-action-path.ts apps/web/src/today-action-path.test.ts e2e/krevstudio-goal-onboarding.spec.ts docs/strategy/ORIGINAL-M1-M16-ACCEPTANCE.md packages/growth/src/pilot-evaluation.ts packages/growth/src/pilot-evaluation.test.ts packages/growth/src/acquisition.ts packages/growth/src/acquisition.test.ts packages/growth/src/discovery.ts packages/growth/src/discovery.test.ts packages/growth/src/performance.ts packages/growth/src/performance.test.ts packages/growth/src/today-actions.ts apps/web/vite.config.ts README.md
      - name: Commit formatting when necessary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/growth/creative.integration.test.ts apps/api/src/growth/creative-routes.ts apps/api/src/platform/creative-documents.ts apps/api/src/platform/creative-documents.test.ts apps/api/src/platform/creative-evaluation.ts apps/api/src/platform/creative-evaluation.test.ts apps/web/src/pages/audit.tsx apps/web/src/pages/public.tsx apps/web/src/pages/today.tsx apps/web/src/today-action-path.ts apps/web/src/today-action-path.test.ts e2e/krevstudio-goal-onboarding.spec.ts docs/strategy/ORIGINAL-M1-M16-ACCEPTANCE.md packages/growth/src/pilot-evaluation.ts packages/growth/src/pilot-evaluation.test.ts packages/growth/src/acquisition.ts packages/growth/src/acquisition.test.ts packages/growth/src/discovery.ts packages/growth/src/discovery.test.ts packages/growth/src/performance.ts packages/growth/src/performance.test.ts packages/growth/src/today-actions.ts apps/web/vite.config.ts README.md
          if ! git diff --cached --quiet; then
            git commit -m "style: format original M1-M16 implementation changes"
            git push origin HEAD:feature/krevstudio-creative-m5-motion-editor
          fi
