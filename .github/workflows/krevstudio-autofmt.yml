name: Temporary brand document formatting
on:
  push:
    branches:
      - feature/krevstudio-creative-m5-motion-editor
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/design/KREVSTUDIO-BRAND-GUIDELINES.md
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design/KREVSTUDIO-BRAND-GUIDELINES.md
          if ! git diff --cached --quiet; then
            git commit -m "style(brand): apply canonical Prettier markdown formatting"
            git push origin HEAD:feature/krevstudio-creative-m5-motion-editor
          fi
