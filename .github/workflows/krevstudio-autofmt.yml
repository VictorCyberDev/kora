name: Krevstudio branch formatting
on:
  push:
    branches:
      - feature/krevstudio-creative-m5-motion-editor
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/src/growth/creative.integration.test.ts apps/api/src/growth/studio.integration.test.ts apps/web/src/pages/audit.tsx apps/web/src/pages/public.tsx docs/strategy/ORIGINAL-M1-M16-ACCEPTANCE.md packages/growth/src/acquisition.test.ts packages/growth/src/acquisition.ts packages/growth/src/pilot-evaluation.test.ts packages/growth/src/pilot-evaluation.ts
      - name: Commit formatting only when required
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/growth/creative.integration.test.ts apps/api/src/growth/studio.integration.test.ts apps/web/src/pages/audit.tsx apps/web/src/pages/public.tsx docs/strategy/ORIGINAL-M1-M16-ACCEPTANCE.md packages/growth/src/acquisition.test.ts packages/growth/src/acquisition.ts packages/growth/src/pilot-evaluation.test.ts packages/growth/src/pilot-evaluation.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format Krevstudio M1-M16 integration changes"
            git push origin HEAD:feature/krevstudio-creative-m5-motion-editor
          fi
