name: Temporary Krevstudio integration formatting
on:
  push:
    branches:
      - feature/krevstudio-creative-m5-motion-editor
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/pages/presence.tsx apps/web/src/pages/public.tsx apps/web/src/pages/studio.tsx apps/web/src/motion-editor.tsx apps/web/src/pages/project-library.tsx apps/web/src/pages/today.tsx apps/api/src/growth/marketing.integration.test.ts e2e/krevstudio-video-first-onboarding.spec.ts
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/presence.tsx apps/web/src/pages/public.tsx apps/web/src/pages/studio.tsx apps/web/src/motion-editor.tsx apps/web/src/pages/project-library.tsx apps/web/src/pages/today.tsx apps/api/src/growth/marketing.integration.test.ts e2e/krevstudio-video-first-onboarding.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format M4-M10-M9 integration fixes"
            git push origin HEAD:feature/krevstudio-creative-m5-motion-editor
          fi
