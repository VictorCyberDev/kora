name: One-shot format repair
on:
  push:
    branches: [milestone-3-diagnosis-engine]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-3-diagnosis-engine
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/src/diagnosis.ts apps/api/src/diagnosis.test.ts apps/api/src/store.ts
      - run: rm .github/workflows/format-repair.yml
      - name: Commit formatted repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/diagnosis.ts apps/api/src/diagnosis.test.ts apps/api/src/store.ts .github/workflows/format-repair.yml
          git commit -m "style: apply prettier to targeted repair"
          git push origin HEAD:milestone-3-diagnosis-engine
