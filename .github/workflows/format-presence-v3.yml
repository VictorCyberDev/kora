name: Format Presence v3

on:
  push:
    branches:
      - design-presence-os-v3

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design-presence-os-v3
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Format only the new Presence v3 files
        run: >-
          pnpm exec prettier --write
          apps/web/src/brand-v3.css
          apps/web/src/pages/dashboard-v3.tsx
          docs/research/AFRICA-PRESENCE-OS-2026.md
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/brand-v3.css apps/web/src/pages/dashboard-v3.tsx docs/research/AFRICA-PRESENCE-OS-2026.md
          git commit -m "style: format Presence v3 files"
          git push origin HEAD:design-presence-os-v3
