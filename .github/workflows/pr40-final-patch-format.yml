name: PR40 final patch formatting
on:
  push:
    branches: [feature/kora-creative-intelligence-m1-m2]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.3}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/src/platform/studio-media-guard.ts apps/web/src/pages/website-studio.tsx apps/api/src/platform/unsplash-stock.ts packages/site-schema/src/v3/plan.ts
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/platform/studio-media-guard.ts apps/web/src/pages/website-studio.tsx apps/api/src/platform/unsplash-stock.ts packages/site-schema/src/v3/plan.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(pr40): normalize final media, Studio and lint fixes'
            git push origin HEAD:feature/kora-creative-intelligence-m1-m2
          fi
