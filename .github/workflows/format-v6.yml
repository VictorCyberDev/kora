name: Format v6 branch

on:
  push:
    branches: [kora-v6-product-flow-fix]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kora-v6-product-flow-fix
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format v6 files
        run: >-
          pnpm exec prettier --write
          apps/web/src/landing-v6.css
          apps/web/src/pages/dashboard-v3.tsx
          apps/web/src/pages/new-site-v6.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/landing-v6.css apps/web/src/pages/dashboard-v3.tsx apps/web/src/pages/new-site-v6.tsx
          git commit -m "chore: format v6 release files"
          git push origin HEAD:kora-v6-product-flow-fix
