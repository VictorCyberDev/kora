name: Format Kora v6

on:
  push:
    branches:
      - kora-v6-premium-flow-repair

permissions:
  contents: write

jobs:
  prettier:
    if: ${{ !contains(github.event.head_commit.message, '[prettier]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kora-v6-premium-flow-repair
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format v6 files
        run: >-
          pnpm exec prettier --write
          apps/web/src/AppV6.tsx
          apps/web/src/landing-v6.css
          apps/web/src/pages/entry-v6.tsx
          apps/web/src/pages/new-site-v6.tsx
          apps/web/src/site-selection.test.ts
          apps/web/src/site-selection.ts
          apps/web/src/main.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/AppV6.tsx apps/web/src/landing-v6.css apps/web/src/pages/entry-v6.tsx apps/web/src/pages/new-site-v6.tsx apps/web/src/site-selection.test.ts apps/web/src/site-selection.ts apps/web/src/main.tsx
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git commit -m "chore: format Kora v6 files [prettier]"
          git push origin HEAD:kora-v6-premium-flow-repair
