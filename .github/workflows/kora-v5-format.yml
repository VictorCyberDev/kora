name: Kora v5 format
on:
  push:
    branches: [kora-v5-mobile-reference-atlas]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kora-v5-mobile-reference-atlas
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Kora v5 files with repository Prettier
        run: >-
          pnpm exec prettier --write
          apps/web/src/brand-v5.css
          apps/web/src/builder-v5.css
          packages/site-schema/src/v2/atlas-plan.ts
          packages/site-schema/src/v2/catalog.ts
          packages/site-schema/src/v2/reference-atlas.test.ts
          packages/site-schema/src/v2/reference-atlas.ts
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/brand-v5.css apps/web/src/builder-v5.css packages/site-schema/src/v2/atlas-plan.ts packages/site-schema/src/v2/catalog.ts packages/site-schema/src/v2/reference-atlas.test.ts packages/site-schema/src/v2/reference-atlas.ts
          git commit -m 'style: format Kora v5 changes'
          git push origin HEAD:kora-v5-mobile-reference-atlas
