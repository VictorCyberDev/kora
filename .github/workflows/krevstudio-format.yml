name: Krevstudio source formatter
on:
  push:
    branches: [feature/krevstudio-m3-m4-transformation]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.3}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/src/platform/creative-documents.ts apps/api/src/platform/creative-documents.test.ts apps/api/src/platform/creative-document-routes.ts apps/api/src/platform/index.ts apps/web/src/pages/krev-creative-studio.tsx apps/web/src/App.tsx apps/web/src/pages/more.tsx
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/platform/creative-documents.ts apps/api/src/platform/creative-documents.test.ts apps/api/src/platform/creative-document-routes.ts apps/api/src/platform/index.ts apps/web/src/pages/krev-creative-studio.tsx apps/web/src/App.tsx apps/web/src/pages/more.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'style(krevstudio): format new M3 M4 creative engine'
            git push origin HEAD:feature/krevstudio-m3-m4-transformation
          fi
