name: Kora v5 bundle curated Atlas media

on:
  push:
    branches: [kora-v5-mobile-reference-atlas]
    paths:
      - .github/workflows/kora-v5-bundle-media.yml

permissions:
  contents: write

jobs:
  bundle-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kora-v5-mobile-reference-atlas
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and optimize curated Pexels media
        run: |
          python -m pip install --quiet pillow requests
          python <<'PY'
          from io import BytesIO
          from pathlib import Path
          import requests
          from PIL import Image

          assets = {
              "barber-black-client-cut.webp": 35157692,
              "barber-detail-grooming.webp": 35157699,
              "barber-shop-service.webp": 33418521,
              "bakery-nigeria-maker.webp": 35367277,
              "bakery-cake-making.webp": 8478047,
              "bakery-cake-frosting.webp": 8477970,
              "lawyer-office-work.webp": 7875863,
              "law-office-consultation.webp": 8152740,
              "law-documents-detail.webp": 8112134,
          }
          out = Path("packages/site-media/files")
          out.mkdir(parents=True, exist_ok=True)
          headers = {"User-Agent": "Kora media bundler/1.0"}
          for name, photo_id in assets.items():
              url = f"https://images.pexels.com/photos/{photo_id}/pexels-photo-{photo_id}.jpeg?auto=compress&cs=tinysrgb&w=1600"
              response = requests.get(url, headers=headers, timeout=45)
              response.raise_for_status()
              image = Image.open(BytesIO(response.content)).convert("RGB")
              image.thumbnail((1600, 1200), Image.Resampling.LANCZOS)
              image.save(out / name, "WEBP", quality=82, method=6)
              print(name, image.size)
          PY
      - name: Commit bundled assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/site-media/files/*.webp
          if git diff --cached --quiet; then
            echo "No media changes"
            exit 0
          fi
          git commit -m "feat(atlas): bundle vertical media for self-contained sites"
          git push origin HEAD:kora-v5-mobile-reference-atlas
