name: Kora v5 media contract fix
on:
  push:
    branches: [kora-v5-mobile-reference-atlas]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kora-v5-mobile-reference-atlas
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Update media contract tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/site-schema/test/v2.test.ts')
          s = p.read_text()
          old = '''    const ids = new Set(MEDIA_CATALOG.map((e) => e.file));
              for (const { d } of all) {
                const html = renderSiteV2(d.spec)["index.html"]!;
                for (const m of html.matchAll(/<img\\b[^>]*>/g)) {
                  const src = /src="([^"]+)"/.exec(m[0])![1]!;
                  expect(src.startsWith("/_kora/media/"), src).toBe(true);
                  expect(ids.has(src.slice("/_kora/media/".length)), src).toBe(true);
                  expect(m[0]).toMatch(/alt="[^"]+"/);
                }
              }'''
          new = '''    const bundled = new Set(
                MEDIA_CATALOG.flatMap((e) => (e.file ? [e.file] : [])),
              );
              const external = new Set(
                MEDIA_CATALOG.flatMap((e) => (e.externalUrl ? [e.externalUrl] : [])),
              );
              for (const { d } of all) {
                const html = renderSiteV2(d.spec)["index.html"]!;
                for (const m of html.matchAll(/<img\\b[^>]*>/g)) {
                  const src = /src="([^"]+)"/.exec(m[0])![1]!;
                  if (src.startsWith("/_kora/media/")) {
                    expect(
                      bundled.has(src.slice("/_kora/media/".length)),
                      src,
                    ).toBe(true);
                  } else {
                    const decoded = src.replaceAll("&amp;", "&");
                    expect(decoded.startsWith("https://"), src).toBe(true);
                    expect(external.has(decoded), src).toBe(true);
                  }
                  expect(m[0]).toMatch(/alt="[^"]+"/);
                }
              }'''
          if old not in s:
              raise SystemExit('first media block not found')
          s = s.replace(old, new)
          old = '''    for (const e of MEDIA_CATALOG) {
                expect(existsSync(new URL(e.file, dir)), e.file).toBe(true);
                expect(statSync(new URL(e.file, dir)).size, e.file).toBeLessThan(260_000);
                expect(e.license).toBe("Pexels License");
                expect(e.sourceUrl).toMatch(/^https:\\/\\/www\\.pexels\\.com\\/photo\\//);
                expect(e.alt.length).toBeGreaterThan(20);
              }'''
          new = '''    for (const e of MEDIA_CATALOG) {
                if (e.file) {
                  expect(existsSync(new URL(e.file, dir)), e.file).toBe(true);
                  expect(statSync(new URL(e.file, dir)).size, e.file).toBeLessThan(
                    260_000,
                  );
                } else {
                  expect(e.externalUrl).toMatch(/^https:\\/\\//);
                }
                expect(e.license).toBe("Pexels License");
                expect(e.sourceUrl).toMatch(/^https:\\/\\/www\\.pexels\\.com\\/photo\\//);
                expect(e.alt.length).toBeGreaterThan(20);
              }'''
          if old not in s:
              raise SystemExit('catalog completeness block not found')
          s = s.replace(old, new)
          old = '''    for (const r of [
                "law",
                "saas",
                "interior-design",
                "barber",
                "salon-beauty",
                "consultant-coach",
                "fitness-gym",
              ])
                expect(fits(r), r).toBeUndefined();'''
          new = '''    expect(fits("barber")?.url).toMatch(/^https:\\/\\/images\\.pexels\\.com\\//);
              expect(fits("law")?.url).toMatch(/^https:\\/\\/images\\.pexels\\.com\\//);
              for (const r of [
                "saas",
                "interior-design",
                "salon-beauty",
                "consultant-coach",
                "fitness-gym",
              ])
                expect(fits(r), r).toBeUndefined();'''
          if old not in s:
              raise SystemExit('honest representation block not found')
          p.write_text(s)
          PY
      - name: Format touched files
        run: pnpm exec prettier --write packages/site-schema/test/v2.test.ts packages/site-schema/src/v2/atlas-plan.ts
      - name: Commit contract update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/site-schema/test/v2.test.ts packages/site-schema/src/v2/atlas-plan.ts
          git commit -m 'test(media): support licensed external catalog assets'
          git push origin HEAD:kora-v5-mobile-reference-atlas
