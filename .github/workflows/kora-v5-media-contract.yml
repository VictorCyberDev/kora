name: Kora v5 align bundled media contract

on:
  push:
    branches: [kora-v5-mobile-reference-atlas]
    paths:
      - .github/workflows/kora-v5-media-contract.yml

permissions:
  contents: write

jobs:
  align-media-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kora-v5-mobile-reference-atlas
      - name: Align catalogue compatibility and tests with same-origin media
        run: |
          python <<'PY'
          from pathlib import Path

          catalog = Path("packages/site-schema/src/v2/catalog.ts")
          text = catalog.read_text()
          needle = '  file: string;\n  alt: string;'
          replacement = '  file: string;\n  /** Kept optional for backwards-compatible catalogue consumers; runtime media is bundled. */\n  externalUrl?: string;\n  alt: string;'
          if needle not in text:
              raise SystemExit("catalog interface anchor not found")
          catalog.write_text(text.replace(needle, replacement, 1))

          test = Path("packages/site-schema/test/v2.test.ts")
          text = test.read_text()
          old_barber = '    expect(fits("barber")?.url).toMatch(/^https:\\/\\/images\\.pexels\\.com\\//);'
          new_barber = '    expect(fits("barber")?.url).toContain("/_kora/media/barber-");'
          old_law = '    expect(fits("law")?.url).toMatch(/^https:\\/\\/images\\.pexels\\.com\\//);'
          new_law = '    expect(fits("law")?.url).toContain("/_kora/media/law");'
          if old_barber not in text or old_law not in text:
              raise SystemExit("media expectation anchors not found")
          text = text.replace(old_barber, new_barber, 1).replace(old_law, new_law, 1)
          test.write_text(text)
          PY
      - name: Commit contract alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/site-schema/src/v2/catalog.ts packages/site-schema/test/v2.test.ts
          git commit -m "test(atlas): enforce same-origin curated media"
          git push origin HEAD:kora-v5-mobile-reference-atlas
