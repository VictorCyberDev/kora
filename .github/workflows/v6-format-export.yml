name: v6 format export

on:
  push:
    branches:
      - kora-v6-product-flow-fix

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format release files
        run: pnpm exec prettier --write apps/web/src/landing-v6.css apps/web/src/pages/dashboard-v3.tsx apps/web/src/pages/new-site-v6.tsx
      - uses: actions/upload-artifact@v4
        with:
          name: v6-formatted-files
          path: |
            apps/web/src/landing-v6.css
            apps/web/src/pages/dashboard-v3.tsx
            apps/web/src/pages/new-site-v6.tsx
