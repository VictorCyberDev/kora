name: Kora v5 media assertion
on:
  push:
    branches: [kora-v5-mobile-reference-atlas]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kora-v5-mobile-reference-atlas
          fetch-depth: 0
      - name: Align honest-media assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/site-schema/test/v2.test.ts')
          s = p.read_text()
          old = '''    for (const r of [
                "law",
                "saas",
                "interior-design",
                "barber",
                "salon-beauty",
                "consultant-coach",
                "fitness-gym",
              ])
                expect(fits(r), r).toBeUndefined();'''
          new = '''    expect(fits("barber")?.url).toMatch(/^https:\\/\\/images\\.pexels\\.com\\//);
              expect(fits("law")?.url).toMatch(/^https:\\/\\/images\\.pexels\\.com\\//);
              for (const r of [
                "saas",
                "interior-design",
                "salon-beauty",
                "consultant-coach",
                "fitness-gym",
              ])
                expect(fits(r), r).toBeUndefined();'''
          if old not in s:
              raise SystemExit('legacy assertion block not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit assertion update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/site-schema/test/v2.test.ts
          git commit -m 'test(media): expect licensed barber and legal photography'
          git push origin HEAD:kora-v5-mobile-reference-atlas
