name: PR40 lockfile and formatting repair
on:
  push:
    branches:
      - feature/kora-creative-intelligence-m1-m2
permissions:
  contents: write
jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Reconcile pinned Puck lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Format only PR40 implementation files
        run: |
          pnpm exec prettier --write \
            packages/creative/src/design-rules.ts \
            packages/creative/src/directions.ts \
            packages/creative/test/design-rules.test.ts \
            packages/site-schema/src/v3/spec.ts \
            packages/site-schema/src/v3/render.ts \
            packages/site-schema/src/v3/index.ts \
            packages/site-schema/src/v3/page-edit.ts \
            packages/site-schema/test/page-edit.test.ts \
            apps/api/src/platform/author.ts \
            apps/web/src/pages/website-studio.tsx \
            apps/web/src/pages/build.tsx \
            apps/web/src/App.tsx \
            apps/web/package.json \\
            e2e/website-studio-benchmark.spec.ts \\
            e2e/website-studio-flow.spec.ts
      - name: Commit reproducible lockfile and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml packages/creative packages/site-schema apps/api/src/platform/author.ts apps/web/src/pages/website-studio.tsx apps/web/src/pages/build.tsx apps/web/src/App.tsx apps/web/package.json e2e/website-studio-benchmark.spec.ts e2e/website-studio-flow.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore(pr40): reconcile Puck lockfile and format source"
            git push origin HEAD:feature/kora-creative-intelligence-m1-m2
          fi
