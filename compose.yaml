services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kora
      POSTGRES_PASSWORD: kora
      POSTGRES_DB: kora
    ports:
      - '5432:5432'
    volumes:
      - kora-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kora -d kora']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kora-postgres:
